[package]
name = "edu1sces"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ahash = "0.8.12"
anyhow = "1.0.100"
dashmap = "6.1"
lapack = "0.20.0"
pyo3 = { version = "0.27.2", features = ["anyhow"] }
rand = "0.9.2"
rayon = "1.11.0"
wigner-symbols = "0.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
lapack-src = { version = "0.10", features = ["accelerate"] }

[target.'cfg(target_os = "linux")'.dependencies]
lapack-src = { version = "0.10", features = ["openblas"] }

[features]
default = []
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
